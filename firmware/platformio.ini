; iSprinklr v2 firmware
;
; Phase 0 scope: bring up the network, report status, accept firmware over HTTP,
; and recover from a bad update without a USB cable. No zone control, no
; scheduling, no NVS schema yet — those arrive over OTA.
;
; The platform version is pinned deliberately. v1 pulled a floating "stable" zip
; URL, so builds were not reproducible between machines or over time.

[platformio]
default_envs = ethernet
boards_dir = boards

[env]
platform = espressif32@7.1.3
framework = arduino
board = waveshare_esp32s3_eth
board_build.partitions = partitions_ota.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_ldf_mode = chain
lib_compat_mode = strict
lib_deps =
  ESP32Async/AsyncTCP@^3.0.0
  ESP32Async/ESPAsyncWebServer@^3.0.0
  bblanchon/ArduinoJson@^7.0.0

build_flags =
  -DFW_VERSION=\"0.1.0-phase0\"
  -DCORE_DEBUG_LEVEL=3

; Wired Ethernet (W5500 over SPI3). The installed configuration.
[env:ethernet]
build_flags =
  ${env.build_flags}
  -DNET_USE_ETHERNET=1

; WiFi fallback. Credentials come from the environment so they stay out of git:
;   export ISPRINKLR_WIFI_SSID=... ISPRINKLR_WIFI_PASSWORD=...
; Unset variables expand to empty strings and the build still succeeds, so check
; the serial log if association fails.
[env:wifi]
build_flags =
  ${env.build_flags}
  -DNET_USE_ETHERNET=0
  '-DWIFI_SSID="${sysenv.ISPRINKLR_WIFI_SSID}"'
  '-DWIFI_PASSWORD="${sysenv.ISPRINKLR_WIFI_PASSWORD}"'

; Deploy over the network once Phase 0 is installed:
;   pio run -e ethernet
;   curl -F "firmware=@.pio/build/ethernet/firmware.bin" http://<ip>/api/update
