; iSprinklr v2 firmware
;
; Layout: lib/ holds pure logic with no Arduino dependency (frame building,
; validation, decisions); src/ holds the I/O edges. Host tests in test/ build
; lib/ only, under [env:native].
;
; The platform version is pinned deliberately. v1 pulled a floating "stable" zip
; URL, so builds were not reproducible between machines or over time.
;
; pioarduino, not the official registry platform: official espressif32 7.x still
; ships Arduino-ESP32 2.0.17 (IDF 4.4), which has no W5500 support in ETH.h.
; 55.03.311 = Arduino-ESP32 3.3.11 on ESP-IDF 5.5.5. Bump the tag deliberately.

[platformio]
default_envs = ethernet
boards_dir = boards
; Site settings (router address, Wi-Fi credentials) live in secrets.ini next to
; this file. It is gitignored; copy secrets.example.ini to start one. Values
; there override the empty defaults in [secrets] below. A missing file is fine.
extra_configs = secrets.ini

; Defaults for a build without secrets.ini (CI, a fresh checkout). Do not put
; real values here; this file is public.
[secrets]
ntp_server =
wifi_ssid =
wifi_password =

; Shared by the device environments. Not [env], so the native test env does
; not inherit a board, a framework, or the Arduino-only libraries.
[esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = waveshare_esp32s3_eth
board_build.partitions = partitions_ota.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_ldf_mode = chain
lib_compat_mode = strict
lib_deps =
  ESP32Async/AsyncTCP@3.6.1
  ESP32Async/ESPAsyncWebServer@3.12.1
  bblanchon/ArduinoJson@7.4.3

build_flags =
  -DFW_VERSION=\"0.6.2-phase6\"
  -DCORE_DEBUG_LEVEL=3
  '-DNTP_LOCAL_SERVER="${secrets.ntp_server}"'

; Warns loudly when secrets.ini does not name the router (include/config.h).
extra_scripts = pre:scripts/check_secrets.py

; Wired Ethernet (W5500 over SPI3). The installed configuration.
[env:ethernet]
extends = esp32
build_flags =
  ${esp32.build_flags}
  -DNET_USE_ETHERNET=1

; WiFi fallback. Credentials come from secrets.ini. Empty values still build,
; so check the serial log if association fails.
[env:wifi]
extends = esp32
build_flags =
  ${esp32.build_flags}
  -DNET_USE_ETHERNET=0
  '-DWIFI_SSID="${secrets.wifi_ssid}"'
  '-DWIFI_PASSWORD="${secrets.wifi_password}"'

; Host unit tests: pio test -e native
; Builds lib/ and test/ only (src/ is device code). Needs a host C++ compiler.
[env:native]
platform = native
test_framework = unity
lib_compat_mode = off
lib_ldf_mode = chain
lib_deps =
  bblanchon/ArduinoJson@7.4.3
build_flags =
  -std=c++17
  -Wall
  -Wextra

; Deploy over the network once Phase 0 is installed:
;   pio run -e ethernet
;   curl -F "firmware=@.pio/build/ethernet/firmware.bin" http://$ISPRINKLR_DEVICE/api/update
