;
; Site settings for the firmware build. Copy to secrets.ini (gitignored) and
; fill in; PlatformIO reads it through extra_configs in platformio.ini. Values
; are compiled into the image, so rebuild and OTA after changing one.

[secrets]
; LAN NTP server, tried before the public ones. The router's IPv4 address.
; Without it the build warns: a reboot during a WAN outage leaves the device
; with no valid time, and nothing waters until the WAN is back.
ntp_server =

; Only for the wifi environment. The installed device uses Ethernet.
wifi_ssid =
wifi_password =
